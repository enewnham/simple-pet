[project]
name = "simple-pet"
version = "0.1.0"
description = "A native desktop pet with a local Haiku companion daemon"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.79,<1",
    "nltk>=3.9.2,<4",
    "pyobjc-framework-naturallanguage>=12.2.2,<13",
]

[tool.uv]
package = false

[tool.ruff]
extend-include = ["bin/pet-notify", "scripts/pet-hook"]

[tool.ruff.lint]
extend-select = ["ANN"]

[tool.ty.src]
include = ["**/*.py", "scripts/pet-hook", "bin/pet-notify"]

[tool.ty.rules]
missing-type-argument = "error"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "ty>=0.0.90",
]
