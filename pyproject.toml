[project]
name = "simple-pet"
version = "0.1.0"
description = "A native desktop pet with a local Haiku companion daemon"
requires-python = ">=3.15"
dependencies = [
    "anthropic>=1,<2",
    "nltk>=3.9.2,<4",
    "pydantic>=2.12,<3",
    "pyobjc-framework-naturallanguage>=12.2.2,<13",
    "rich>=14,<15",
    "structlog>=26.1,<27",
    "textual>=6,<7",
]

[tool.uv]
package = false

[tool.ruff]

[tool.ruff.lint]
extend-select = ["ANN"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.pylint]
max-statements = 100

[tool.ty.src]
include = ["**/*.py"]

[tool.ty.rules]
missing-type-argument = "error"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.17.1",
    "ty>=0.0.90",
]
